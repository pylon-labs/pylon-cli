# Repository-owned workflow. Generation preserves .github/.
name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag on current reviewed main (for example v0.1.0)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      publishing: ${{ steps.source.outputs.publishing }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate reviewed release source and maintainer
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/verify-release-source.sh

  checks:
    if: github.event_name == 'workflow_dispatch'
    needs: source
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  plan:
    if: ${{ always() && needs.source.result == 'success' && (github.event_name == 'pull_request' || needs.checks.result == 'success') }}
    needs: [source, checks]
    runs-on: ubuntu-24.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Install checksum-pinned cargo-dist
        run: bash .github/scripts/install-dist.sh
      - name: Plan artifacts
        id: plan
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=("--tag=$RELEASE_TAG"); fi
          dist plan "${args[@]}" --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.plan.result == 'success' }}
    needs: [source, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Enable Windows long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ join(matrix.targets, '-') }}
      - name: Install checksum-pinned cargo-dist
        shell: bash
        run: bash .github/scripts/install-dist.sh
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install build dependencies
        run: ${{ matrix.packages_install }}
      - name: Build archives
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=("--tag=$RELEASE_TAG"); fi
          dist build "${args[@]}" --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "ARTIFACT_PATHS<<EOF" >> "$GITHUB_ENV"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"
          cp dist-manifest.json "target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ env.ARTIFACT_PATHS }}
            target/distrib/*-dist-manifest.json

  build-global-artifacts:
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.plan.result == 'success' && needs.build-local-artifacts.result == 'success' }}
    needs: [source, plan, build-local-artifacts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Install checksum-pinned cargo-dist
        run: bash .github/scripts/install-dist.sh
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Build installers and checksums
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=("--tag=$RELEASE_TAG"); fi
          dist build "${args[@]}" --artifacts=global --output-format=json > dist-manifest.json
          echo 'ARTIFACT_PATHS<<EOF' >> "$GITHUB_ENV"
          jq --raw-output '.upload_files[]' dist-manifest.json >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifacts-build-global
          path: |
            ${{ env.ARTIFACT_PATHS }}
            dist-manifest.json

  attest:
    if: github.event_name == 'workflow_dispatch'
    needs: [source, checks, plan, build-global-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-build-*
          path: artifacts
          merge-multiple: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/*

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [source, checks, plan, build-local-artifacts, build-global-artifacts, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.source.outputs.sha }}
      - name: Revalidate source immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ needs.source.outputs.tag }}
          EXPECTED_RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: bash .github/scripts/verify-release-source.sh
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          jq -r .announcement_github_body artifacts/plan-dist-manifest.json > "$RUNNER_TEMP/release-notes.md"
          title=$(jq -r .announcement_title artifacts/plan-dist-manifest.json)
          prerelease=()
          if jq -e .announcement_is_prerelease artifacts/plan-dist-manifest.json >/dev/null; then prerelease+=(--prerelease); fi
          rm -f artifacts/*-dist-manifest.json
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" --draft "${prerelease[@]}" \
            --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$RELEASE_TAG" artifacts/*
          gh release edit "$RELEASE_TAG" --draft=false
